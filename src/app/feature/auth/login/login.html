<div class="min-h-screen bg-slate-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
    <div class="mb-8">
      <h1 class="text-2xl font-semibold text-slate-900">NoShop</h1>
      <p class="mt-1 text-sm text-slate-500">Sign in to continue</p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700">Email</label>
        <input type="email" formControlName="email"
          class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-500"
          placeholder="you@example.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-1 text-xs text-red-600">Enter a valid email.</p>
        }
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input type="password" formControlName="password"
          class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2 outline-none focus:border-slate-500"
          placeholder="Password" />
      </div>

      <button type="submit" [disabled]="loading"
        class="w-full rounded-md bg-slate-900 px-4 py-2.5 text-sm font-medium text-white disabled:opacity-60">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
